# Self-host: Lorvik server plus Postgres.
#   docker compose up -d
#   open http://localhost:8080
# Set LORVIK_POSTGRES_PASSWORD and LORVIK_VERSION (a released version, for
# example 0.4.0) in a .env file next to this compose file.
name: lorvik

services:
  db:
    image: percona/percona-distribution-postgresql:19
    restart: unless-stopped
    environment:
      POSTGRES_DB: lorvik
      POSTGRES_USER: lorvik
      POSTGRES_PASSWORD: ${LORVIK_POSTGRES_PASSWORD:?set LORVIK_POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorvik -d lorvik"]
      interval: 5s
      timeout: 3s
      retries: 10

  lorvikd:
    image: ghcr.io/bonfiretrunk/lorvikd:${LORVIK_VERSION:?set LORVIK_VERSION in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LORVIK_HTTP_ADDR: ":8080"
      LORVIK_DATABASE_URL: postgres://lorvik:${LORVIK_POSTGRES_PASSWORD}@db:5432/lorvik?sslmode=disable
      LORVIK_LOG_FORMAT: json
    ports:
      - "8080:8080"

volumes:
  pgdata:
