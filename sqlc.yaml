version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlcgen
        out: internal/store/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_db_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: xid8
            go_type: uint64
          - db_type: pg_catalog.xid8
            go_type: uint64
