version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard
  enable:
    - errname
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - sloglint
    - unconvert
    - unparam
    - usetesting
    - depguard
    - modernize
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard errors package and fmt.Errorf with %w
            - pkg: io/ioutil
              desc: deprecated; use io and os
            - pkg: math/rand$
              desc: use math/rand/v2, or crypto/rand for anything secret
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: var-naming
        - name: context-as-argument
        - name: unexported-return
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: false
      context: scope
  exclusions:
    generated: lax
    presets: [std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [noctx, errorlint]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/BonfireTrunk/lorvik]
